services:
  linkedin-browser:
    build: ./services/LinkedInBrowser
    image: linkedin-browser:local
    container_name: linkedin-browser
    volumes:
      - linkedin_browser_profile:/profile
      - ./shared/browser_session_backup:/session-backup
    ports:
      - "127.0.0.1:6080:6080"
    expose:
      - "9222"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  jobseeker:
    build: ./services/JobSeeker
    image: linkedin-jobseeker:local
    container_name: linkedin-jobseeker
    env_file: .env.workers
    environment:
      SERVICE_NAME: JobSeeker
      CENTRAL_SCHEDULER_MODE: "1"
      CRON_TEST_MODE: ${CRON_TEST_MODE:-0}
      SAFE_MODE: ${SAFE_MODE:-0}
      LINKEDIN_CDP_ENDPOINT: http://linkedin-browser:9222
    depends_on:
      linkedin-browser:
        condition: service_healthy
    volumes: &common_volumes
      - ./shared/legacy_state:/Users/deploydog-ai/LinkedIn/shared/legacy_state
      - ./shared/message_state:/Users/deploydog-ai/LinkedIn/shared/message_state
      - ./shared/comment_state:/Users/deploydog-ai/LinkedIn/shared/comment_state
      - ./shared/screenshots:/Users/deploydog-ai/LinkedIn/BlockScreenshots
      - ./shared/resumes:/Users/deploydog-ai/Downloads/RESUME:ro
      - ./shared/logs:/shared/logs
      - ./shared/block_screenshots:/shared/block_screenshots
      - linkedin_runtime:/shared/runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  connectman:
    build: ./services/ConnectMan
    image: linkedin-connectman:local
    container_name: linkedin-connectman
    env_file: .env.workers
    environment:
      SERVICE_NAME: ConnectMan
      CENTRAL_SCHEDULER_MODE: "1"
      CRON_TEST_MODE: ${CRON_TEST_MODE:-0}
      SAFE_MODE: ${SAFE_MODE:-0}
      LINKEDIN_CDP_ENDPOINT: http://linkedin-browser:9222
      LINKEDIN_CONNECT_HEADLESS: "1"
    depends_on:
      linkedin-browser:
        condition: service_healthy
    volumes: *common_volumes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  sendman:
    build: ./services/SendMan
    image: linkedin-sendman:local
    container_name: linkedin-sendman
    env_file: .env.workers
    environment:
      SERVICE_NAME: SendMan
      CENTRAL_SCHEDULER_MODE: "1"
      CRON_TEST_MODE: ${CRON_TEST_MODE:-0}
      SAFE_MODE: ${SAFE_MODE:-0}
      LINKEDIN_CDP_ENDPOINT: http://linkedin-browser:9222
    depends_on:
      linkedin-browser:
        condition: service_healthy
    volumes: *common_volumes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  postliker:
    build: ./services/PostLiker
    image: linkedin-postliker:local
    container_name: linkedin-postliker
    env_file: .env.workers
    environment:
      SERVICE_NAME: PostLiker
      CENTRAL_SCHEDULER_MODE: "1"
      CRON_TEST_MODE: ${CRON_TEST_MODE:-0}
      SAFE_MODE: ${SAFE_MODE:-0}
      LINKEDIN_CDP_ENDPOINT: http://linkedin-browser:9222
      LINKEDIN_LIKE_HEADLESS: "1"
    depends_on:
      linkedin-browser:
        condition: service_healthy
    volumes: *common_volumes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

